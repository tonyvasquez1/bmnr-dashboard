<style>
  :root {
    --bg: #121212;
    --card: #1c1c1e;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #e8c26a;
    --border: #3a3a3a;
    --good: #6fae7a;
    --bad: #d97b6c;
    --info: #7fb3e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    height: 100%;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    margin: 4px 0 16px;
  }
  .controls {
    display: flex;
    gap: 10px;
    row-gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .verb-btn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
  }
  .verb-btn.active {
    background: var(--accent);
    color: #1c1c1e;
    border-color: var(--accent);
    font-weight: bold;
  }
  .btn-review {
    background: var(--good);
    color: #fff;
    border: 1px solid var(--good);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-review.active {
    background: #4d8a58;
    border-color: #4d8a58;
  }
  .btn-reset {
    background: var(--bad);
    color: #fff;
    border: 1px solid var(--bad);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .mastered-label {
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  details.mood-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    padding: 4px 14px;
  }
  details.mood-panel summary {
    padding: 10px 0;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: bold;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  details.mood-panel summary::-webkit-details-marker { display: none; }
  details.mood-panel summary::after {
    content: "▾";
    font-size: 0.85rem;
    transition: transform 0.15s ease;
  }
  details.mood-panel[open] summary::after {
    transform: rotate(180deg);
  }
  .mood-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    padding-bottom: 12px;
  }
  .mood-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.78rem;
  }
  .sub-panel {
    border-top: 1px solid var(--border);
    padding-top: 8px;
    margin-top: 10px;
  }
  .sub-panel summary {
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: bold;
    color: var(--text);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }
  .sub-panel summary::-webkit-details-marker { display: none; }
  .sub-panel summary::after {
    content: "▾";
    font-size: 0.75rem;
    color: var(--muted);
    transition: transform 0.15s ease;
  }
  .sub-panel[open] > summary::after {
    transform: rotate(180deg);
  }
  .sub-panel .mood-grid {
    padding: 6px 0 4px;
  }
  .sub-sub-panel {
    margin-left: 14px;
    border-top: 1px solid var(--border);
    padding-top: 6px;
    margin-top: 8px;
  }
  .sub-sub-panel summary {
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: bold;
    color: var(--muted);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
  }
  .sub-sub-panel summary::-webkit-details-marker { display: none; }
  .sub-sub-panel summary::after {
    content: "▾";
    font-size: 0.68rem;
    transition: transform 0.15s ease;
  }
  .sub-sub-panel[open] > summary::after {
    transform: rotate(180deg);
  }
  .sub-sub-panel .mood-grid {
    padding: 4px 0 2px;
  }
  #verbPills {
    justify-content: flex-start;
  }
  .pill-readonly {
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 3px 9px;
    font-size: 0.68rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .quirk-tag {
    font-weight: normal;
    font-style: italic;
    opacity: 0.75;
  }
  .pill-readonly.inactive {
    color: var(--muted);
    border-color: var(--border);
    font-weight: normal;
  }
  .pill-readonly:active {
    opacity: 0.7;
  }
  .pill-empty {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .mood-item input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .mood-actions {
    display: flex;
    gap: 8px;
    padding-bottom: 12px;
  }
  .mood-actions button {
    font-family: inherit;
    font-size: 0.75rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .sub-actions {
    padding-top: 6px;
    padding-bottom: 8px;
  }
  .sub-actions button {
    font-size: 0.68rem;
    padding: 2px 8px;
  }
  .progress {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
  }
  .card-divider {
    border-top: 2px solid #666;
    width: 100%;
  }
  .divider-top {
    margin-top: 18px;
  }
  .divider-bottom {
    margin-bottom: 18px;
  }
  .phrase-zone {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 100%;
    padding: 26px 0;
    min-height: 64px;
  }
  .card-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 100%;
  }
  #btnRowReveal {
    margin-top: 0;
  }
  .tag {
    text-align: center;
    font-size: 0.95rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tag .t-verb { color: var(--accent); }
  .tag .t-person { color: var(--info); }
  .tag .t-mood { color: var(--bad); }
  .tag .t-sep { color: var(--muted); font-weight: normal; }
  .prompt-label {
    font-size: 0.9rem;
    color: var(--accent);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .english {
    font-size: 1.35rem;
    line-height: 1.4;
    font-weight: bold;
    text-align: left;
  }
  .spanish {
    font-size: 1.35rem;
    line-height: 1.4;
    font-weight: bold;
    color: var(--accent);
    margin-top: 20px;
    text-align: left;
  }
  .spanish .hl {
    text-decoration: underline;
    text-decoration-color: var(--good);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
    color: var(--good);
  }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 18px;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    width: 100%;
  }
  button.action {
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 10px;
    padding: 14px 0;
    border: none;
    cursor: pointer;
    flex: 1;
  }
  .btn-reveal {
    background: var(--accent);
    color: #1c1c1e;
  }
  .btn-good {
    background: var(--good);
    color: #12251a;
  }
  .btn-bad {
    background: var(--bad);
    color: #2b120c;
  }
  .btn-next {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .bottom-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .score {
    text-align: center;
    margin-top: 16px;
    font-size: 1.35rem;
    color: var(--muted);
  }
  .score span { color: var(--text); font-weight: bold; }
  .chart-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .chart-toggle-row input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .note-box {
    text-align: left;
    background: rgba(232,194,106,0.08);
    border: 1px solid rgba(232,194,106,0.3);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--text);
  }
  .note-box .note-label {
    color: var(--accent);
    font-weight: bold;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: block;
    margin-bottom: 4px;
  }
  .chart-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .conj-chart {
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 0.88rem;
    min-width: 780px;
  }
  .conj-chart th, .conj-chart td {
    border: 1px solid var(--border);
    padding: 8px 8px;
    text-align: left;
    color: var(--text);
    white-space: nowrap;
  }
  .conj-chart th {
    color: var(--muted);
    font-weight: normal;
    text-transform: uppercase;
    font-size: 0.72rem;
  }
  .conj-chart tr.highlight td {
    background: rgba(232,194,106,0.16);
    font-weight: bold;
  }
  .conj-chart td.person-cell {
    color: var(--muted);
    font-weight: normal;
  }
  .conj-chart tr.highlight td.person-cell {
    color: var(--accent);
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Spanish Flashcards</h1>
  <details class="mood-panel" id="pillsPanelDetails" open>
    <summary id="pillsSummary">Verbs</summary>
    <div class="mood-actions">
      <button id="selectAllPills">Select all</button>
      <button id="clearAllPills">Clear all</button>
    </div>
    <div class="controls" id="verbPills"></div>
  </details>

  <details class="mood-panel" id="verbPanelDetails">
    <summary>Select verbs</summary>
    <div class="mood-actions">
      <button id="selectAllVerbs">Select all</button>
      <button id="clearAllVerbs">Clear all</button>
    </div>

    <details class="sub-panel" id="verbGroupIrregular">
      <summary>Irregular</summary>
      <div class="mood-actions sub-actions">
        <button data-scope="irregular" class="scopeSelectAll">Select all</button>
        <button data-scope="irregular" class="scopeClearAll">Clear all</button>
      </div>
      <div class="mood-grid" id="verbGridIrregular"></div>
    </details>

    <details class="sub-panel" id="verbGroupRegular">
      <summary>Regular</summary>
      <div class="mood-actions sub-actions">
        <button data-scope="regular" class="scopeSelectAll">Select all</button>
        <button data-scope="regular" class="scopeClearAll">Clear all</button>
      </div>

      <details class="sub-sub-panel" id="verbGroupAR">
        <summary>-AR</summary>
        <div class="mood-actions sub-actions">
          <button data-scope="ar" class="scopeSelectAll">Select all</button>
          <button data-scope="ar" class="scopeClearAll">Clear all</button>
        </div>
        <div class="mood-grid" id="verbGridAR"></div>
      </details>

      <details class="sub-sub-panel" id="verbGroupER">
        <summary>-ER</summary>
        <div class="mood-actions sub-actions">
          <button data-scope="er" class="scopeSelectAll">Select all</button>
          <button data-scope="er" class="scopeClearAll">Clear all</button>
        </div>
        <div class="mood-grid" id="verbGridER"></div>
      </details>

      <details class="sub-sub-panel" id="verbGroupIR">
        <summary>-IR</summary>
        <div class="mood-actions sub-actions">
          <button data-scope="ir" class="scopeSelectAll">Select all</button>
          <button data-scope="ir" class="scopeClearAll">Clear all</button>
        </div>
        <div class="mood-grid" id="verbGridIR"></div>
      </details>

      <details class="sub-sub-panel" id="verbGroupOther">
        <summary>Other</summary>
        <div class="mood-actions sub-actions">
          <button data-scope="other" class="scopeSelectAll">Select all</button>
          <button data-scope="other" class="scopeClearAll">Clear all</button>
        </div>
        <div class="mood-grid" id="verbGridOther"></div>
      </details>
    </details>
  </details>

  <div class="progress" id="progressLabel"></div>
  <div class="card" id="card">
    <div class="tag" id="cardTag"></div>

const MOOD_LABELS = Object.fromEntries(ALL_MOODS);

let activeVerbs = new Set(Object.keys(DECK));
let activeMoods = new Set(DEFAULT_ON);
let showChart = false;
let showNote = false;
let deck = [];
let idx = 0;
let score = { good: 0, missed: 0 };
let missedIds = new Set();
let masteredIds = new Set();
let reviewMissedMode = false;
let hideMastered = false;
let storageReady = false;

function cardId(verb, mood, en) {
  return verb + "|" + mood + "|" + en;
}

function debugLog(msg) {
  console.log("[flashcards]", msg);
}

// Storage abstraction: use Claude's window.storage when running inside Claude's
// preview (localStorage may not behave the same way there); fall back to
// localStorage when running standalone (e.g. hosted on GitHub Pages / added to
// Home Screen), where window.storage doesn't exist at all.
const hasClaudeStorage = (typeof window !== "undefined" && window.storage &&
  typeof window.storage.get === "function" && typeof window.storage.set === "function");

debugLog("Storage backend detected: " + (hasClaudeStorage ? "window.storage (Claude)" : "localStorage (standalone)"));

let claudeStorageBroken = false;

async function storageGet(key) {
  if (hasClaudeStorage && !claudeStorageBroken) {
    try {
      const res = await window.storage.get(key, false);
      debugLog("GET " + key + " via window.storage: found value");
      return res ? res.value : null;
    } catch (e) {
      debugLog("GET " + key + " via window.storage: not found / error - " + e.message);
      return null;
    }
  } else {
    try {
      const v = localStorage.getItem(key);
      debugLog("GET " + key + " via localStorage: " + (v ? "found value" : "null"));
      return v;
    } catch (e) {
      debugLog("GET " + key + " via localStorage FAILED: " + e.message);
      return null;
    }
  }
}

async function storageSet(key, value) {
  if (hasClaudeStorage && !claudeStorageBroken) {
    try {
      await window.storage.set(key, value, false);
      debugLog("SAVED " + key + " via window.storage OK");
      return;
    } catch (e) {
      debugLog("window.storage SET failed (" + e.message + ") - switching to localStorage for this session");
      claudeStorageBroken = true;
      // fall through to localStorage below
    }
  }
  try {
    localStorage.setItem(key, value);
    debugLog("SAVED " + key + " via localStorage OK");
  } catch (e) {
    debugLog("SAVE " + key + " via localStorage FAILED: " + e.message);
  }
}

async function loadPreferences() {
  const rawV = await storageGet("spanish_flashcards_active_verbs");
  if (rawV) {
    try {
      const parsed = JSON.parse(rawV);
      if (Array.isArray(parsed) && parsed.length > 0) activeVerbs = new Set(parsed);
    } catch (e) { /* keep defaults */ }
  }
  const rawM = await storageGet("spanish_flashcards_active_moods");
  if (rawM) {
    try {
      const parsed = JSON.parse(rawM);
      if (Array.isArray(parsed)) activeMoods = new Set(parsed);
    } catch (e) { /* keep defaults */ }
  }
}

function saveActiveVerbs() {
  storageSet("spanish_flashcards_active_verbs", JSON.stringify([...activeVerbs]));
}

function saveActiveMoods() {
  storageSet("spanish_flashcards_active_moods", JSON.stringify([...activeMoods]));
}

async function loadMissed() {
  const raw = await storageGet("spanish_flashcards_missed_ids");
  if (raw) {
    try { missedIds = new Set(JSON.parse(raw)); } catch (e) { missedIds = new Set(); }
  }
  const raw2 = await storageGet("spanish_flashcards_mastered_ids");
  if (raw2) {
    try { masteredIds = new Set(JSON.parse(raw2)); } catch (e) { masteredIds = new Set(); }
  }
  storageReady = true;
}

async function saveMissed() {
  await storageSet("spanish_flashcards_missed_ids", JSON.stringify([...missedIds]));
}

async function saveMastered() {
  await storageSet("spanish_flashcards_mastered_ids", JSON.stringify([...masteredIds]));
}


function mdToHtml(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>');
}

function buildDeck() {
  deck = [];
  if (reviewMissedMode) {
    Object.keys(DECK).forEach(v => {
      ALL_MOODS.forEach(([m]) => {
        (DECK[v][m] || []).forEach(card => {
          const id = cardId(v, m, card.en);
          if (missedIds.has(id)) deck.push(Object.assign({verb: v, mood: m, id}, card));
        });
      });
    });
  } else {
    activeVerbs.forEach(v => {
      activeMoods.forEach(m => {
        (DECK[v][m] || []).forEach(card => {
          const id = cardId(v, m, card.en);
          if (hideMastered && masteredIds.has(id)) return; // skip mastered cards
          const entry = Object.assign({verb: v, mood: m, id}, card);
          deck.push(entry);
          if (missedIds.has(id)) deck.push(entry); // reinforce: missed cards appear twice
        });
      });
    });
  }
  shuffleDeck();
  idx = 0;
  score = { good: 0, missed: 0 };
  showCard();
  renderReviewControls();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
}

function renderChart(verb, highlightPerson, isImperative) {
  const c = CONJUGATIONS[verb];
  if (!c) {
    return '<div class="note-box">Full conjugation chart isn\'t added for this verb yet.</div>';
  }
  const persons = PERSONS;
  let rows = "";
  persons.forEach((p, i) => {
    const isHi = p === highlightPerson || (isImperative && mapImperativePerson(p) === highlightPerson);
    rows += `<tr class="${isHi ? 'highlight' : ''}"><td class="person-cell">${p}</td>`;
    CHART_MOODS.forEach(([key]) => { rows += `<td>${c[key][i]}</td>`; });
    rows += `</tr>`;
  });
  let head = `<th></th>`;
  CHART_MOODS.forEach(([,label]) => { head += `<th>${label}</th>`; });
  const gp = `<tr><td class="person-cell">Gerundio / Participio</td><td colspan="2">${GERUNDIOS[verb]} / ${PARTICIPIOS[verb]}</td>` +
    Array(CHART_MOODS.length - 2).fill("<td></td>").join("") + `</tr>`;
  return `<table class="conj-chart"><thead><tr>${head}</tr></thead><tbody>${rows}${gp}</tbody></table>`;
}
function mapImperativePerson(fullPerson) {
  if (fullPerson === "Tú") return "Tú";
  if (fullPerson === "Él/Ella/Usted") return "Usted";
  if (fullPerson === "Nosotros") return "Nosotros";
  if (fullPerson === "Ellos/Ellas/Ustedes") return "Ustedes";
  return fullPerson;
}

function showCard() {
  if (deck.length === 0) {
    document.getElementById("cardTag").textContent = "";
    document.getElementById("englishText").textContent = "";
    document.getElementById("spanishText").style.display = "none";
    document.getElementById("hintText").textContent = reviewMissedMode
      ? "No missed cards yet — nothing to review!"
      : "No cards match your current filters. Select at least one verb and one tense.";
    document.getElementById("btnRowReveal").style.display = "none";
    document.getElementById("answerExtras").style.display = "none";
    document.getElementById("progressLabel").textContent = "";
    return;
  }
  if (idx >= deck.length) idx = 0;
  const c = deck[idx];
  const moodLabel = MOOD_LABELS[c.mood];
  document.getElementById("cardTag").innerHTML =
    '<div>' +
    '<span class="t-verb">' + c.verb.toUpperCase() + '</span>' +
    '<span class="t-sep"> · </span>' +
    '<span class="t-person">' + c.person + '</span>' +
    '</div>' +
    '<div style="margin-top:5px;"><span class="t-mood">' + moodLabel.toUpperCase() + '</span></div>';
  document.getElementById("englishText").textContent = c.en;
  document.getElementById("spanishText").style.display = "none";
  document.getElementById("spanishText").innerHTML = mdToHtml(c.es);
  document.getElementById("hintText").style.display = "none";
  document.getElementById("btnRowReveal").style.display = "flex";
  document.getElementById("answerExtras").style.display = "none";
  document.getElementById("toggleChart").checked = showChart;
  document.getElementById("chartContainer").innerHTML = "";
  document.getElementById("toggleNote").checked = showNote;
  document.getElementById("noteContainer").innerHTML = "";
  updateProgress();
}

function updateProgress() {
  document.getElementById("progressLabel").textContent =
    "Card " + (idx + 1) + " of " + deck.length;
  document.getElementById("scoreLabel").innerHTML =
    "Got it: <span>" + score.good + "</span> &nbsp;&middot;&nbsp; Missed: <span>" + score.missed + "</span>";
}

function reveal() {
  document.getElementById("spanishText").style.display = "block";
  document.getElementById("hintText").style.display = "none";
  document.getElementById("btnRowReveal").style.display = "none";
  document.getElementById("answerExtras").style.display = "block";
  updateChartDisplay();
  updateNoteDisplay();
}

function updateChartDisplay() {
  const c = deck[idx];
  const container = document.getElementById("chartContainer");
  if (showChart && c) {
    const isImp = c.mood === "impAff" || c.mood === "impNeg";
    container.innerHTML = renderChart(c.verb, c.person, isImp);
  } else {
    container.innerHTML = "";
  }
}

function updateNoteDisplay() {
  const c = deck[idx];
  const container = document.getElementById("noteContainer");
  if (showNote && c) {
    const verbNotes = NOTES[c.verb];
    const text = (verbNotes && verbNotes[c.mood]) || (verbNotes && verbNotes._general) ||
      "No specific note for this one — it's a straightforward case.";
    container.innerHTML = '<div class="note-box"><span class="note-label">Why / Common Errors</span>' + text + '</div>';
  } else {
    container.innerHTML = "";
  }
}

function grade(isGood) {
  const c = deck[idx];
  if (c) {
    if (isGood) {
      score.good++;
      if (missedIds.has(c.id)) {
        missedIds.delete(c.id);
        saveMissed();
      }
      if (!masteredIds.has(c.id)) {
        masteredIds.add(c.id);
        saveMastered();
      }
    } else {
      score.missed++;
      if (!missedIds.has(c.id)) {
        missedIds.add(c.id);
        saveMissed();
      }
      if (masteredIds.has(c.id)) {
        masteredIds.delete(c.id);
        saveMastered();
      }
    }
  }
  idx++;
  if (idx >= deck.length) { shuffleDeck(); idx = 0; }
  showCard();
  renderReviewControls();
}

function getVerbsByScope(scope) {
  const bucketOf = key => {
    const meta = verbMeta(key);
    if (meta.type === "irregular") return "irregular";
    if (meta.conj === "ar") return "ar";
    if (meta.conj === "er") return "er";
    if (meta.conj === "ir") return "ir";
    return "other";
  };
  if (scope === "regular") {
    return Object.keys(DECK).filter(k => bucketOf(k) !== "irregular");
  }
  return Object.keys(DECK).filter(k => bucketOf(k) === scope);
}

function getOrderedVerbKeys() {
  const buckets = { irregular: [], ar: [], er: [], ir: [], other: [] };
  Object.keys(DECK).forEach(key => {
    const meta = verbMeta(key);
    let bucket = "other";
    if (meta.type === "irregular") bucket = "irregular";
    else if (meta.conj === "ar") bucket = "ar";
    else if (meta.conj === "er") bucket = "er";
    else if (meta.conj === "ir") bucket = "ir";
    buckets[bucket].push(key);
  });
  Object.values(buckets).forEach(arr => arr.sort((a, b) => verbMeta(a).rank - verbMeta(b).rank));
  return [...buckets.irregular, ...buckets.ar, ...buckets.er, ...buckets.ir, ...buckets.other];
}

// Pure global frequency order (ignores grammar bucket) — used for the pill row,
// since pills are meant to be a plain "most-used-first" glance, unlike the
// checkbox panel which is deliberately grouped by Irregular/AR/ER/IR.
function getGlobalRankOrder() {
  return Object.keys(DECK).sort((a, b) => verbMeta(a).rank - verbMeta(b).rank);
}

function renderVerbPanel() {
  const grids = {
    irregular: document.getElementById("verbGridIrregular"),
    ar: document.getElementById("verbGridAR"),
    er: document.getElementById("verbGridER"),
    ir: document.getElementById("verbGridIR"),
    other: document.getElementById("verbGridOther"),
  };
  Object.values(grids).forEach(g => g.innerHTML = "");
  const counts = { irregular: 0, ar: 0, er: 0, ir: 0, other: 0 };

  getOrderedVerbKeys().forEach(key => {
    const meta = verbMeta(key);
    const wrap = document.createElement("div");
    wrap.className = "mood-item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "verb-" + key;
    cb.checked = activeVerbs.has(key);
    cb.onchange = () => {
      if (cb.checked) activeVerbs.add(key); else activeVerbs.delete(key);
      saveActiveVerbs();
      renderVerbPills();
      buildDeck();
    };
    const lbl = document.createElement("label");
    lbl.htmlFor = "verb-" + key;
    lbl.innerHTML = meta.label + " (" + rankLabel(meta) + ")" + (meta.quirk ? ' <span class="quirk-tag">' + meta.quirk + '</span>' : "");
    wrap.appendChild(cb);
    wrap.appendChild(lbl);

    let bucket = "other";
    if (meta.type === "irregular") bucket = "irregular";
    else if (meta.conj === "ar") bucket = "ar";
    else if (meta.conj === "er") bucket = "er";
    else if (meta.conj === "ir") bucket = "ir";
    grids[bucket].appendChild(wrap);
    counts[bucket]++;
  });

  document.getElementById("verbGroupIrregular").style.display = counts.irregular ? "block" : "none";
  document.getElementById("verbGroupRegular").style.display = (counts.ar + counts.er + counts.ir + counts.other) ? "block" : "none";
  document.getElementById("verbGroupAR").style.display = counts.ar ? "block" : "none";
  document.getElementById("verbGroupER").style.display = counts.er ? "block" : "none";
  document.getElementById("verbGroupIR").style.display = counts.ir ? "block" : "none";
  document.getElementById("verbGroupOther").style.display = counts.other ? "block" : "none";
}

function renderVerbPills() {
  const el = document.getElementById("verbPills");
  el.innerHTML = "";
  document.getElementById("pillsSummary").textContent =
    "Verbs (" + activeVerbs.size + " of " + Object.keys(DECK).length + " selected)";
  getGlobalRankOrder().forEach(key => {
    const isActive = activeVerbs.has(key);
    const pill = document.createElement("button");
    pill.className = "pill-readonly" + (isActive ? "" : " inactive");
    pill.innerHTML = verbMeta(key).label + " (" + rankLabel(verbMeta(key)) + ")" + (verbMeta(key).quirk ? ' <span class="quirk-tag">' + verbMeta(key).quirk + '</span>' : "");
    pill.onclick = () => {
      if (activeVerbs.has(key)) activeVerbs.delete(key); else activeVerbs.add(key);
      saveActiveVerbs();
      renderVerbPanel();
      renderVerbPills();
      buildDeck();
    };
    el.appendChild(pill);
  });
}

function renderMoodGrid() {
  const el = document.getElementById("moodGrid");
  el.innerHTML = "";
  ALL_MOODS.forEach(([key,label]) => {
    const wrap = document.createElement("div");
    wrap.className = "mood-item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "mood-" + key;
    cb.checked = activeMoods.has(key);
    cb.onchange = () => {
      if (cb.checked) activeMoods.add(key); else activeMoods.delete(key);
      saveActiveMoods();
      buildDeck();
    };
    const lbl = document.createElement("label");
    lbl.htmlFor = "mood-" + key;
    lbl.textContent = label;
    wrap.appendChild(cb);
    wrap.appendChild(lbl);
    el.appendChild(wrap);
  });
}

function renderReviewControls() {
  const el = document.getElementById("reviewControls");
  el.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "btn-review" + (reviewMissedMode ? " active" : "");
  btn.textContent = "Review Missed (" + missedIds.size + ")";
  btn.onclick = () => {
    reviewMissedMode = !reviewMissedMode;
    buildDeck();
  };
  el.appendChild(btn);
  const masteredLabel = document.createElement("span");
  masteredLabel.className = "mastered-label";
  masteredLabel.textContent = "Mastered: " + masteredIds.size;
  el.appendChild(masteredLabel);

  const resetBtn = document.createElement("button");
  resetBtn.className = "btn-reset";
  resetBtn.textContent = "Reset Progress";
  resetBtn.onclick = () => {
    if (missedIds.size === 0 && masteredIds.size === 0) {
      alert("Nothing to reset yet — no missed or mastered cards tracked.");
      return;
    }
    if (confirm("Clear all missed and mastered tracking? This can't be undone.")) {
      missedIds = new Set();
      masteredIds = new Set();
      saveMissed();
      saveMastered();
      reviewMissedMode = false;
      buildDeck();
    }
  };
  el.appendChild(resetBtn);
}

document.getElementById("revealBtn").onclick = reveal;
document.getElementById("gotBtn").onclick = () => grade(true);
document.getElementById("missBtn").onclick = () => grade(false);
document.getElementById("nextBtn").onclick = () => { idx++; if (idx >= deck.length) { shuffleDeck(); idx = 0; } showCard(); };
document.getElementById("shuffleBtn").onclick = () => { shuffleDeck(); idx = 0; showCard(); };
document.getElementById("toggleChart").onchange = (e) => { showChart = e.target.checked; updateChartDisplay(); };
document.getElementById("toggleNote").onchange = (e) => { showNote = e.target.checked; updateNoteDisplay(); };
document.getElementById("toggleHideMastered").onchange = (e) => { hideMastered = e.target.checked; buildDeck(); };

  saveActiveMoods();
  renderMoodGrid();
  buildDeck();
};
document.getElementById("clearAllMoods").onclick = () => {
  activeMoods = new Set();
  saveActiveMoods();
  renderMoodGrid();
  buildDeck();
};
document.getElementById("selectAllVerbs").onclick = () => {
  activeVerbs = new Set(Object.keys(DECK));
  saveActiveVerbs();
  renderVerbPanel();
  renderVerbPills();
  buildDeck();
};
document.getElementById("clearAllVerbs").onclick = () => {
  activeVerbs = new Set();
  saveActiveVerbs();
  renderVerbPanel();
  renderVerbPills();
  buildDeck();
};
document.querySelectorAll(".scopeSelectAll").forEach(btn => {
  btn.onclick = () => {
    getVerbsByScope(btn.dataset.scope).forEach(k => activeVerbs.add(k));
    saveActiveVerbs();
    renderVerbPanel();
    renderVerbPills();
    buildDeck();
  };
});
document.querySelectorAll(".scopeClearAll").forEach(btn => {
  btn.onclick = () => {
    getVerbsByScope(btn.dataset.scope).forEach(k => activeVerbs.delete(k));
    saveActiveVerbs();
    renderVerbPanel();
    renderVerbPills();

document.getElementById("selectAllPills").onclick = () => {
  activeVerbs = new Set(Object.keys(DECK));

  renderVerbPanel();
  renderVerbPills();
  buildDeck();
};
document.getElementById("clearAllPills").onclick = () => {
  activeVerbs = new Set();
  saveActiveVerbs();
  renderVerbPanel();
  renderVerbPills();
  buildDeck();
};

(async function init() {
  await loadPreferences();
  await loadMissed();
  renderVerbPanel();
  renderVerbPills();
  renderMoodGrid();
  buildDeck();
})();
