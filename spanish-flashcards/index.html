<style>
  :root {
    --bg: #121212;
    --card: #1c1c1e;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #e8c26a;
    --border: #3a3a3a;
    --good: #6fae7a;
    --bad: #d97b6c;
    --info: #7fb3e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    height: 100%;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    margin: 4px 0 16px;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .verb-btn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
  }
  .verb-btn.active {
    background: var(--accent);
    color: #1c1c1e;
    border-color: var(--accent);
    font-weight: bold;
  }
  details.mood-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    padding: 4px 14px;
  }
  details.mood-panel summary {
    padding: 10px 0;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: bold;
    list-style: none;
  }
  details.mood-panel summary::-webkit-details-marker { display: none; }
  .mood-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    padding-bottom: 12px;
  }
  .mood-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.78rem;
  }
  .mood-item input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .mood-actions {
    display: flex;
    gap: 8px;
    padding-bottom: 12px;
  }
  .mood-actions button {
    font-family: inherit;
    font-size: 0.75rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .progress {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 56px 20px 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 220px;
    position: relative;
  }
  .tag {
    position: absolute;
    top: 14px;
    left: 18px;
    right: 18px;
    font-size: 0.95rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tag .t-verb { color: var(--accent); }
  .tag .t-person { color: var(--info); }
  .tag .t-mood { color: var(--bad); }
  .tag .t-sep { color: var(--muted); font-weight: normal; }
  .prompt-label {
    font-size: 0.8rem;
    color: var(--accent);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .english {
    font-size: 1.35rem;
    line-height: 1.4;
    font-weight: bold;
  }
  .spanish {
    font-size: 1.35rem;
    line-height: 1.4;
    font-weight: bold;
    color: var(--accent);
    margin-top: 18px;
  }
  .spanish .hl {
    text-decoration: underline;
    text-decoration-color: var(--good);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
    color: var(--good);
  }
  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 18px;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    width: 100%;
  }
  button.action {
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 10px;
    padding: 14px 0;
    border: none;
    cursor: pointer;
    flex: 1;
  }
  .btn-reveal {
    background: var(--accent);
    color: #1c1c1e;
  }
  .btn-good {
    background: var(--good);
    color: #12251a;
  }
  .btn-bad {
    background: var(--bad);
    color: #2b120c;
  }
  .btn-next {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .bottom-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .score {
    text-align: center;
    margin-top: 16px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .score span { color: var(--text); font-weight: bold; }
  .chart-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .chart-toggle-row input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .note-box {
    text-align: left;
    background: rgba(232,194,106,0.08);
    border: 1px solid rgba(232,194,106,0.3);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--text);
  }
  .note-box .note-label {
    color: var(--accent);
    font-weight: bold;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    display: block;
    margin-bottom: 4px;
  }
  .chart-scroll {
    overflow-x: auto;
    margin-top: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .conj-chart {
    border-collapse: collapse;
    font-size: 0.88rem;
    min-width: 780px;
  }
  .conj-chart th, .conj-chart td {
    border: 1px solid var(--border);
    padding: 8px 8px;
    text-align: left;
    color: var(--text);
    white-space: nowrap;
  }
  .conj-chart th {
    color: var(--muted);
    font-weight: normal;
    text-transform: uppercase;
    font-size: 0.72rem;
  }
  .conj-chart tr.highlight td {
    background: rgba(232,194,106,0.16);
    font-weight: bold;
  }
  .conj-chart td.person-cell {
    color: var(--muted);
    font-weight: normal;
  }
  .conj-chart tr.highlight td.person-cell {
    color: var(--accent);
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Spanish Flashcards</h1>
  <div class="controls" id="verbFilters"></div>

  <div class="progress" id="progressLabel"></div>
  <div class="card" id="card">
    <div class="tag" id="cardTag"></div>
    <div class="prompt-label">Translate to Spanish</div>
    <div class="english" id="englishText"></div>
    <div class="spanish" id="spanishText" style="display:none;"></div>
    <div class="hint" id="hintText">Tap "Show Answer" when ready</div>
    <div class="btn-row" id="btnRowReveal">
      <button class="action btn-reveal" id="revealBtn">Show Answer</button>
    </div>
    <div id="answerExtras" style="display:none; width:100%;">
      <div class="chart-toggle-row">
        <input type="checkbox" id="toggleChart">
        <label for="toggleChart">Show full conjugation chart</label>
      </div>
      <div class="chart-scroll" id="chartContainer"></div>
      <div class="chart-toggle-row">
        <input type="checkbox" id="toggleNote">
        <label for="toggleNote">Show why / common errors</label>
      </div>
      <div id="noteContainer"></div>
      <div class="btn-row" id="btnRowGrade">
        <button class="action btn-bad" id="missBtn">Missed It</button>
        <button class="action btn-good" id="gotBtn">Got It</button>
      </div>
    </div>
  </div>

  <details class="mood-panel" open>
    <summary>Select tenses / moods</summary>
    <div class="mood-actions">
      <button id="selectAllMoods">Select all</button>
      <button id="clearAllMoods">Clear all</button>
    </div>
    <div class="mood-grid" id="moodGrid"></div>
  </details>

  <div class="bottom-row">
    <button class="action btn-next" id="shuffleBtn">Shuffle</button>
    <button class="action btn-next" id="nextBtn">Skip →</button>
  </div>

  <div class="controls" id="reviewControls"></div>
  <div class="mood-row" id="hideMasteredRow" style="justify-content:center; margin-bottom:14px;">
    <input type="checkbox" id="toggleHideMastered">
    <label for="toggleHideMastered">Don't repeat cards I've gotten correct</label>
  </div>

  <div class="score" id="scoreLabel"></div>
</div>

<script>
const MOODS = [
  ["presente","Presente"],
  ["preterito","Pretérito"],
  ["imperfecto","Imperfecto"],
  ["futuro","Futuro"],
  ["condicional","Condicional"],
  ["subjPres","Subj. Presente"],
  ["subjImp","Subj. Imperfecto"],
  ["indPerf","Indicativo Perfecto"],
  ["subjPerf","Subj. Perfecto"],
  ["subjPlup","Subj. Pluscuamperfecto"],
  ["impAff","Imperativo Afirm."],
  ["impNeg","Imperativo Neg."],
];
// Chart columns only include the per-person tenses (gerundio/participio render as a fixed summary row instead)
const CHART_MOODS = MOODS;
const NONPERSON_MOODS = [
  ["gerundio","Gerundio"],
  ["participio","Participio"],
];
const ALL_MOODS = MOODS.concat(NONPERSON_MOODS);
const DEFAULT_ON = new Set(ALL_MOODS.map(m => m[0]));

const GERUNDIOS = { ser: "siendo", estar: "estando", ir: "yendo" };
const PARTICIPIOS = { ser: "sido", estar: "estado", ir: "ido" };

const NOTES = {
  ser: {
    presente: "Ser is used for identity, characteristics, origin, profession, and time — inherent/definitional traits, not temporary states (which use estar instead).",
    preterito: "Fue marks a completed, bounded past event or period. Careful: fue is also the preterite of ir — identical spelling, different verb, distinguished only by context.",
    imperfecto: "Era describes an ongoing background state/characteristic in the past with no specific end point — contrast with fue (preterito), which frames the same info as a completed, bounded event.",
    futuro: "Simple future (seré) is less common in everyday speech than ir+a+infinitive ('voy a ser...') for near-future plans.",
    condicional: "Sería = hypothetical/softened 'would be.' Often paired with a 'si' + imperfect subjunctive clause (Si fuera..., sería...).",
    subjPres: "Triggered by a wish/doubt/emotion verb + que + a different subject (espero que, dudo que, quieren que). Without that trigger, this would be plain indicative (es/eres/soy).",
    subjImp: "Used in hypothetical 'si' clauses (Si yo fuera...) or under a past-tense trigger. Built from fueron (ellos pretérito) minus -ron, + -ra — NOT from subjunctive presente, since that shortcut breaks for irregular verbs.",
    indPerf: "He sido = plain factual statement, indicative, no trigger needed. Compare Subj. Perfecto (haya sido), used when this same idea sits inside a wish/doubt/emotion clause.",
    subjPerf: "Haya sido appears because a wish/doubt/emotion trigger (se alegra de que, espero que, dudo que) governs the clause — even though the action already happened, the emotional framing forces subjunctive.",
    subjPlup: "Hubiera sido = 'had been,' the past-hypothetical counterpart to fuera. Used in 'si' clauses about the unchangeable past (Si hubiera sido..., habría...).",
    impAff: "Sé is the irregular tú command for ser — it must be memorized, not derived. Usted/nosotros/ustedes commands (sea/seamos/sean) do match the regular subjunctive-presente pattern.",
    impNeg: "Negative commands always use 'no' + subjunctive presente, for every person including tú (no seas) — a different, regular-pattern form from the irregular affirmative tú command (sé).",
    gerundio: "Siendo is valid but relatively rare in everyday speech — mostly appears in formal/literary adverbial clauses ('Siendo honesto...'), not in progressive constructions.",
    participio: "Sido is invariable (never changes for gender/number) and used almost exclusively inside compound tenses (he sido, había sido) — it doesn't function as a standalone adjective.",
  },
  estar: {
    presente: "Estar is used for location, temporary states/conditions, and ongoing actions (with gerundio) — contrast with ser, used for identity/inherent traits.",
    preterito: "Estuve marks a completed, bounded period in a specific state or place — a temporary condition now finished, viewed as a completed event.",
    imperfecto: "Estaba describes an ongoing past state/condition with no specific end point — contrast with estuve (preterito), which frames the same state as a completed, bounded event.",
    futuro: "Simple future (estaré) is less common in speech than ir+a+infinitive ('voy a estar...') for near-future plans.",
    condicional: "Estaría = hypothetical/softened 'would be.' Often appears with a 'si' + imperfect subjunctive clause (Si estuviera..., estaría...).",
    subjPres: "Triggered by a wish/doubt/emotion verb + que + a different subject. Without that trigger, this would be plain indicative (está/estoy/están).",
    subjImp: "Used in hypothetical 'si' clauses (Si yo estuviera...) or under a past-tense trigger. Built from estuvieron (ellos pretérito) minus -ron, + -ra.",
    indPerf: "He estado = plain factual statement, indicative. Compare Subj. Perfecto (haya estado), used when embedded in a wish/doubt/emotion clause.",
    subjPerf: "Haya estado appears because a wish/doubt/emotion trigger governs the clause, even though the state already occurred.",
    subjPlup: "Hubiera estado = 'had been (at/in a state),' the past-hypothetical counterpart to estuviera.",
    impAff: "Está (tú command) is actually regular — it matches the él/ella present-indicative form. Usted/nosotros/ustedes commands (esté/estemos/estén) match subjunctive presente.",
    impNeg: "Negative commands always use 'no' + subjunctive presente for every person, including tú (no estés).",
    gerundio: "Estando is valid, mostly in adverbial clauses ('Estando en casa...'). Note: estar doesn't normally pair with its OWN gerundio for progressive meaning — estar+gerundio progressive is for other verbs (estoy comiendo), not for estar itself.",
    participio: "Estado is invariable in compound tenses (he estado, había estado) and, unusually, doubles as the Spanish noun for 'state/condition' (el estado).",
  },

      {person:"Él/Ella/Usted", en:"If he had gone to the doctor, he would feel better now.", es:"Si él **hubiera ido** al médico, se sentiría mejor ahora."},
      {person:"Nosotros", en:"If we had gone together, it would have been easier.", es:"Si **hubiéramos ido** juntos, habría sido más fácil."},
      {person:"Ellos/Ellas/Ustedes", en:"If they had gone earlier, they wouldn't have missed it.", es:"Si **hubieran ido** más temprano, no lo habrían perdido."},
    ],
    impAff: [
      {person:"Tú", en:"Go home.", es:"**Ve** a casa."},
      {person:"Usted", en:"Go ahead. (formal)", es:"**Vaya** adelante."},
      {person:"Nosotros", en:"Let's go!", es:"¡**Vamos**!"},
      {person:"Ustedes", en:"Go together.", es:"**Vayan** juntos."},
    ],
    impNeg: [
      {person:"Tú", en:"Don't go without me.", es:"No **vayas** sin mí."},
      {person:"Usted", en:"Don't go yet. (formal)", es:"No **vaya** todavía."},
      {person:"Nosotros", en:"Let's not go there.", es:"No **vayamos** allí."},
      {person:"Ustedes", en:"Don't go alone.", es:"No **vayan** solos."},
    ],
    gerundio: [
      {person:"—", en:"Going down the street, I saw her.", es:"**Yendo** por la calle, la vi."},
    ],
    participio: [
      {person:"—", en:"Having gone there before, I knew the way.", es:"**Habiendo ido** allí antes, yo sabía el camino."},
    ],
  }
};

const MOOD_LABELS = Object.fromEntries(ALL_MOODS);

let activeVerbs = ["ser","estar","ir"];
let activeMoods = new Set(DEFAULT_ON);
let showChart = false;
let showNote = false;
let deck = [];
let idx = 0;
let score = { good: 0, missed: 0 };
let missedIds = new Set();
let masteredIds = new Set();
let reviewMissedMode = false;
let hideMastered = false;
let storageReady = false;

function cardId(verb, mood, en) {
  return verb + "|" + mood + "|" + en;
}

async function loadMissed() {
  try {
    const raw = localStorage.getItem("spanish_flashcards_missed_ids");
    if (raw) missedIds = new Set(JSON.parse(raw));
  } catch (e) {
    missedIds = new Set();
  }
  try {
    const raw2 = localStorage.getItem("spanish_flashcards_mastered_ids");
    if (raw2) masteredIds = new Set(JSON.parse(raw2));
  } catch (e) {
    masteredIds = new Set();
  }
  storageReady = true;
}

async function saveMissed() {
  try {
    localStorage.setItem("spanish_flashcards_missed_ids", JSON.stringify([...missedIds]));
  } catch (e) {
    // storage save failed (e.g. private browsing); state still works for this session
  }
}

async function saveMastered() {
  try {
    localStorage.setItem("spanish_flashcards_mastered_ids", JSON.stringify([...masteredIds]));
  } catch (e) {
    // storage save failed; state still works for this session
  }
}


function mdToHtml(s) {
  return s.replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>');
}

function buildDeck() {
  deck = [];
  if (reviewMissedMode) {
    ["ser","estar","ir"].forEach(v => {
      ALL_MOODS.forEach(([m]) => {
        (DECK[v][m] || []).forEach(card => {
          const id = cardId(v, m, card.en);
          if (missedIds.has(id)) deck.push(Object.assign({verb: v, mood: m, id}, card));
        });
      });
    });
  } else {
    activeVerbs.forEach(v => {
      activeMoods.forEach(m => {
        (DECK[v][m] || []).forEach(card => {
          const id = cardId(v, m, card.en);
          if (hideMastered && masteredIds.has(id)) return; // skip mastered cards
          const entry = Object.assign({verb: v, mood: m, id}, card);
          deck.push(entry);
          if (missedIds.has(id)) deck.push(entry); // reinforce: missed cards appear twice
        });
      });
    });
  }
  shuffleDeck();
  idx = 0;
  score = { good: 0, missed: 0 };
  showCard();
  renderReviewControls();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
}

function renderChart(verb, highlightPerson, isImperative) {
  const c = CONJUGATIONS[verb];
  const persons = PERSONS;
  let rows = "";
  persons.forEach((p, i) => {
    const isHi = p === highlightPerson || (isImperative && mapImperativePerson(p) === highlightPerson);
    rows += `<tr class="${isHi ? 'highlight' : ''}"><td class="person-cell">${p}</td>`;
    CHART_MOODS.forEach(([key]) => { rows += `<td>${c[key][i]}</td>`; });
    rows += `</tr>`;
  });
  let head = `<th></th>`;
  CHART_MOODS.forEach(([,label]) => { head += `<th>${label}</th>`; });
  const gp = `<tr><td class="person-cell">Gerundio / Participio</td><td colspan="2">${GERUNDIOS[verb]} / ${PARTICIPIOS[verb]}</td>` +
    Array(CHART_MOODS.length - 2).fill("<td></td>").join("") + `</tr>`;
  return `<table class="conj-chart"><thead><tr>${head}</tr></thead><tbody>${rows}${gp}</tbody></table>`;
}
function mapImperativePerson(fullPerson) {
  if (fullPerson === "Tú") return "Tú";
  if (fullPerson === "Él/Ella/Usted") return "Usted";
  if (fullPerson === "Nosotros") return "Nosotros";
  if (fullPerson === "Ellos/Ellas/Ustedes") return "Ustedes";
  return fullPerson;
}

function showCard() {
  if (deck.length === 0) {
    document.getElementById("cardTag").textContent = "";
    document.getElementById("englishText").textContent = "";
    document.getElementById("spanishText").style.display = "none";
    document.getElementById("hintText").textContent = reviewMissedMode
      ? "No missed cards yet — nothing to review!"
      : "No cards match your current filters. Select at least one verb and one tense.";
    document.getElementById("btnRowReveal").style.display = "none";
    document.getElementById("answerExtras").style.display = "none";
    document.getElementById("progressLabel").textContent = "";
    return;
  }
  if (idx >= deck.length) idx = 0;
  const c = deck[idx];
  const moodLabel = MOOD_LABELS[c.mood];
  document.getElementById("cardTag").innerHTML =
    '<span class="t-verb">' + c.verb.toUpperCase() + '</span>' +
    '<span class="t-sep"> · </span>' +
    '<span class="t-person">' + c.person + '</span>' +
    '<span class="t-sep"> · </span>' +
    '<span class="t-mood">' + moodLabel.toUpperCase() + '</span>';
  document.getElementById("englishText").textContent = c.en;
  document.getElementById("spanishText").style.display = "none";
  document.getElementById("spanishText").innerHTML = mdToHtml(c.es);
  document.getElementById("hintText").textContent = "Tap \"Show Answer\" when ready";
  document.getElementById("hintText").style.display = "block";
  document.getElementById("btnRowReveal").style.display = "flex";
  document.getElementById("answerExtras").style.display = "none";
  document.getElementById("toggleChart").checked = showChart;
  document.getElementById("chartContainer").innerHTML = "";
  document.getElementById("toggleNote").checked = showNote;
  document.getElementById("noteContainer").innerHTML = "";
  updateProgress();
}

function updateProgress() {
  document.getElementById("progressLabel").textContent =
    "Card " + (idx + 1) + " of " + deck.length;
  document.getElementById("scoreLabel").innerHTML =
    "Got it: <span>" + score.good + "</span> &nbsp;&middot;&nbsp; Missed: <span>" + score.missed + "</span>";
}

function reveal() {
  document.getElementById("spanishText").style.display = "block";
  document.getElementById("hintText").style.display = "none";
  document.getElementById("btnRowReveal").style.display = "none";
  document.getElementById("answerExtras").style.display = "block";
  updateChartDisplay();
  updateNoteDisplay();
}

function updateChartDisplay() {
  const c = deck[idx];
  const container = document.getElementById("chartContainer");
  if (showChart && c) {
    const isImp = c.mood === "impAff" || c.mood === "impNeg";
    container.innerHTML = renderChart(c.verb, c.person, isImp);
  } else {
    container.innerHTML = "";
  }
}

function updateNoteDisplay() {
  const c = deck[idx];
  const container = document.getElementById("noteContainer");
  if (showNote && c) {
    const text = (NOTES[c.verb] && NOTES[c.verb][c.mood]) || "No specific note for this one — it's a straightforward case.";
    container.innerHTML = '<div class="note-box"><span class="note-label">Why / Common Errors</span>' + text + '</div>';
  } else {
    container.innerHTML = "";
  }
}

function grade(isGood) {
  const c = deck[idx];
  if (c) {
    if (isGood) {
      score.good++;
      if (missedIds.has(c.id)) {
        missedIds.delete(c.id);
        saveMissed();
      }
      if (!masteredIds.has(c.id)) {
        masteredIds.add(c.id);
        saveMastered();
      }
    } else {
      score.missed++;
      if (!missedIds.has(c.id)) {
        missedIds.add(c.id);
        saveMissed();
      }
      if (masteredIds.has(c.id)) {
        masteredIds.delete(c.id);
        saveMastered();
      }
    }
  }
  idx++;
  if (idx >= deck.length) { shuffleDeck(); idx = 0; }
  showCard();
  renderReviewControls();
}

function renderVerbFilters() {
  const el = document.getElementById("verbFilters");
  el.innerHTML = "";
  const options = [["all","All"],["ser","Ser"],["estar","Estar"],["ir","Ir"]];
  options.forEach(([key,label]) => {
    const btn = document.createElement("button");
    btn.className = "verb-btn";
    btn.textContent = label;
    const isActive = key === "all" ? activeVerbs.length === 3 : (activeVerbs.length === 1 && activeVerbs[0] === key);
    if (isActive) btn.classList.add("active");
    btn.onclick = () => {
      activeVerbs = key === "all" ? ["ser","estar","ir"] : [key];
      renderVerbFilters();
      buildDeck();
    };
    el.appendChild(btn);
  });
}

function renderMoodGrid() {
  const el = document.getElementById("moodGrid");
  el.innerHTML = "";
  ALL_MOODS.forEach(([key,label]) => {
    const wrap = document.createElement("div");
    wrap.className = "mood-item";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "mood-" + key;
    cb.checked = activeMoods.has(key);
    cb.onchange = () => {
      if (cb.checked) activeMoods.add(key); else activeMoods.delete(key);
      buildDeck();
    };
    const lbl = document.createElement("label");
    lbl.htmlFor = "mood-" + key;
    lbl.textContent = label;
    wrap.appendChild(cb);
    wrap.appendChild(lbl);
    el.appendChild(wrap);
  });
}

function renderReviewControls() {
  const el = document.getElementById("reviewControls");
  el.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "verb-btn" + (reviewMissedMode ? " active" : "");
  btn.textContent = "Review Missed (" + missedIds.size + ")";
  btn.onclick = () => {
    reviewMissedMode = !reviewMissedMode;
    buildDeck();
  };
  el.appendChild(btn);
  const masteredLabel = document.createElement("span");
  masteredLabel.style.color = "var(--muted)";
  masteredLabel.style.fontSize = "0.82rem";
  masteredLabel.style.alignSelf = "center";
  masteredLabel.textContent = "Mastered: " + masteredIds.size;
  el.appendChild(masteredLabel);

  if (missedIds.size > 0 || masteredIds.size > 0) {
    const resetBtn = document.createElement("button");
    resetBtn.className = "verb-btn";
    resetBtn.style.color = "var(--bad)";
    resetBtn.style.borderColor = "var(--bad)";
    resetBtn.textContent = "Reset Progress";
    resetBtn.onclick = () => {
      if (confirm("Clear all missed and mastered tracking? This can't be undone.")) {
        missedIds = new Set();
        masteredIds = new Set();
        saveMissed();
        saveMastered();
        reviewMissedMode = false;
        buildDeck();
      }
    };
    el.appendChild(resetBtn);
  }
}

document.getElementById("revealBtn").onclick = reveal;
document.getElementById("gotBtn").onclick = () => grade(true);
document.getElementById("missBtn").onclick = () => grade(false);
document.getElementById("nextBtn").onclick = () => { idx++; if (idx >= deck.length) { shuffleDeck(); idx = 0; } showCard(); };
document.getElementById("shuffleBtn").onclick = () => { shuffleDeck(); idx = 0; showCard(); };
document.getElementById("toggleChart").onchange = (e) => { showChart = e.target.checked; updateChartDisplay(); };
document.getElementById("toggleNote").onchange = (e) => { showNote = e.target.checked; updateNoteDisplay(); };
document.getElementById("toggleHideMastered").onchange = (e) => { hideMastered = e.target.checked; buildDeck(); };
document.getElementById("selectAllMoods").onclick = () => {
  activeMoods = new Set(ALL_MOODS.map(m => m[0]));
  renderMoodGrid();
  buildDeck();
};
document.getElementById("clearAllMoods").onclick = () => {
  activeMoods = new Set();
  renderMoodGrid();
  buildDeck();
};

(async function init() {
  renderVerbFilters();
  renderMoodGrid();
  await loadMissed();
  buildDeck();
})();

</script>
</body>
</html>
